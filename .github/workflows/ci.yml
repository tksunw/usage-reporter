name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Latest Claude Code, so a runtime change that breaks the mod shows up here
      # before it shows up in someone's session. The mod needs 2.1.288 or later.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code version
        run: claude --version

      - name: Validate
        run: claude plugin validate .

      - name: Test
        run: claude plugin test .
